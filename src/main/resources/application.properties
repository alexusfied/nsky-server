spring.application.name=api

spring.config.import=optional:file:.env[.properties]

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/nsky
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

server.port=8192

ollama.base.url=${OLLAMA_BASE_URL}
ollama.model.name=${OLLAMA_MODEL_NAME}
mistral.base.url=https://api.mistral.ai

mistral.api.key=${MISTRAL_API_KEY}

# SPRING AI
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.ollama.chat.model=${OLLAMA_MODEL_NAME}
